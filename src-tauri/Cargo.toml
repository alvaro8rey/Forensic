[package]
name = "aeon-data-systems"
version = "1.0.0"
description = "Aeon Data Systems - Forensic Recovery & Military-Grade Shredder"
authors = ["Aeon Data Systems"]
license = "MIT"
edition = "2021"
rust-version = "1.75"

[[bin]]
name = "aeon-data-systems"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "1.5", features = [] }

[dependencies]
tauri = { version = "1.6", features = [
    "dialog-open",
    "dialog-save",
    "fs-read-dir",
    "fs-read-file",
    "fs-write-file",
    "notification-all",
    "shell-open",
    "window-all",
] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Concurrency
crossbeam = "0.8"
crossbeam-channel = "0.5"
rayon = "1.8"
tokio = { version = "1.36", features = ["full"] }

# Binary parsing
binread = "2.2"
byteorder = "1.5"
nom = "7.1"

# System info
sysinfo = "0.30"

# Hashing & cryptography
sha2 = "0.10"
rand = "0.8"
rand_chacha = "0.3"
zeroize = { version = "1.7", features = ["derive"] }

# Logging
log = "0.4"
env_logger = "0.11"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Encoding
base64 = "0.22"
zip = "2"

# Error handling
anyhow = "1.0"
thiserror = "1.0"

# Async
futures = "0.3"
async-trait = "0.1"

# Platform-specific (Windows)
# He limpiado las features de winapi y windows-sys para que sean las reales de la API de Windows
[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { version = "0.52", features = [
    "Win32_Foundation",
    "Win32_Storage_FileSystem",
    "Win32_System_Ioctl",
    "Win32_System_IO",
    "Win32_System_Threading",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_System_LibraryLoader",
] }
winapi = { version = "0.3", features = [
    "winioctl",
    "fileapi",
    "handleapi",
    "ioapiset",
    "winbase",
    "errhandlingapi",
] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true

[profile.dev]
opt-level = 0
debug = true
